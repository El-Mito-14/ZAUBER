<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b2d31">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Zauber</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <!-- Funktion 1: 3D-Würfel -->
  <section id="screen-cube" class="screen active">
    <div class="stage grow">
      <canvas id="cube3d"></canvas>
      <button class="info" data-info="cube" aria-label="Hinweise">i</button>
      <div class="overlay" id="cubeStatus">Züge: 0</div>
    </div>
    <div id="autoBar" class="row" hidden>
      <button id="aPause" class="primary">Pause</button>
      <button id="aStop">Stopp</button>
      <select id="selSpeedCube" aria-label="Geschwindigkeit"></select>
    </div>
    <div class="seg" id="modeSeg">
      <button data-m="free" class="on">Frei</button>
      <button data-m="view">Nur Ansicht</button>
      <button data-m="layer">Nur Ebenen</button>
    </div>
    <div class="row">
      <button id="btnScramble">Mischen</button>
      <button id="btnUndo">Zurück</button>
      <button id="btnReset">Neu</button>
      <button id="btnAutoSolve" class="primary">Lösen</button>
    </div>
  </section>

  <!-- Funktion 2: Muster eingeben + Lösung -->
  <section id="screen-solve" class="screen">
    <div id="inputPane" class="pane">
      <div class="stage grow">
        <canvas id="preview3d"></canvas>
        <div class="palbar" id="palette" hidden></div>
        <div class="overlay" id="inToast"></div>
      </div>
      <div id="errBox" class="err" hidden></div>
      <div class="row">
        <button class="infoBtn" data-info="input" aria-label="Hinweise">i</button>
        <button id="btnClear">Leeren</button>
        <button id="btnFromCube">Vom 3D-Würfel</button>
        <button id="btnCompute" class="primary">Lösung berechnen</button>
      </div>
    </div>

    <div id="solvePane" class="pane" hidden>
      <div class="topRow"><div id="phaseTitle"></div><button class="infoBtn" id="btnPhaseInfo" aria-label="Hinweise">i</button></div>
      <div class="stage grow">
        <canvas id="solve3d"></canvas>
        <canvas id="netMini" class="netOv"></canvas>
      </div>
      <div class="moveRow">
        <div class="move" id="moveBig">-</div>
        <div class="moveCol"><div class="moveDesc" id="moveDesc"></div><div class="status" id="stepInfo"></div></div>
        <select id="selSpeed" aria-label="Geschwindigkeit"></select>
      </div>
      <div class="row ctrl">
        <button id="bStart" aria-label="Anfang" title="Anfang"></button>
        <button id="bBack" aria-label="Zurück" title="Zurück"></button>
        <button id="bAuto" class="primary" aria-label="Auto" title="Auto"></button>
        <button id="bNext" aria-label="Weiter" title="Weiter"></button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="row">
        <button id="btnFollow" class="toggle">Folgen</button>
        <button id="btnAlg">Algorithmus</button>
        <button id="btnRecipe">Rezept</button>
        <button id="btnBackInput">Neu</button>
      </div>
    </div>
  </section>

  <!-- Lektionen -->
  <section id="screen-lessons" class="screen">
    <div id="lessonListWrap">
      <div class="seg" id="lessonTabs"></div>
      <div id="lessonList"></div>
    </div>
    <div id="lessonDetail" class="pane" hidden>
      <div class="topRow"><button id="lBack">Zurück</button><div id="lTitle" class="ltitle"></div><button class="infoBtn" id="btnLInfo" aria-label="Hinweise">i</button></div>
      <div class="stage grow">
        <canvas id="lesson3d"></canvas>
        <div class="ovThumb left"><canvas id="lBefore" class="thumb"></canvas><span>Vorher</span></div>
        <div class="ovThumb right"><canvas id="lAfter" class="thumb"></canvas><span>Nachher</span></div>
      </div>
      <div class="chips" id="lMoves"></div>
      <div class="row ctrl">
        <button id="lStart" aria-label="Anfang" title="Anfang"></button>
        <button id="lBackStep" aria-label="Zurück" title="Zurück"></button>
        <button id="lAuto" class="primary" aria-label="Auto" title="Auto"></button>
        <button id="lNext" aria-label="Weiter" title="Weiter"></button>
      </div>
      <div class="row"><div class="status grow" id="lInfo"></div><select id="selSpeedLesson" aria-label="Geschwindigkeit"></select></div>
    </div>
  </section>

  <!-- Design -->
  <section id="screen-settings" class="screen">
    <div class="row"><button id="themeBtn" class="themeBtn"></button></div>
    <div class="ringWrap"><canvas id="ring"></canvas><button id="ringOk">Fertig</button></div>
  </section>
</main>
<nav>
  <button id="tab-cube" class="active">Würfel</button>
  <button id="tab-solve">Lösen</button>
  <button id="tab-lessons">Lektionen</button>
  <button id="tab-settings">Design</button>
</nav>
<div id="modal" hidden><div class="card"><div id="modalText"></div><button id="modalClose" class="primary wide">OK</button></div></div>
<script src="cube.js"></script>
<script src="solver.js"></script>
<script src="lessons.js"></script>
<script src="render.js"></script>
<script src="thumbs.js"></script>
<script src="app.js"></script>
</body>
</html>
