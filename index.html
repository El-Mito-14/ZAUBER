<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b2d31">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Zauber</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <!-- Funktion 1: 3D-Würfel -->
  <section id="screen-cube" class="screen active">
    <div class="stage grow">
      <canvas id="cube3d"></canvas>
      <button class="info" data-info="cube" aria-label="Hinweise">i</button>
      <div class="overlay" id="cubeStatus">Züge: 0</div>
    </div>
    <div id="autoBar" class="row" hidden>
      <button id="aPause" class="primary">⏸ Pause</button>
      <button id="aStop">■ Stopp</button>
      <select id="selSpeedCube" aria-label="Geschwindigkeit"></select>
    </div>
    <div class="row">
      <button id="btnScramble">🔀 Mischen</button>
      <button id="btnUndo">↶ Zurück</button>
      <button id="btnReset">⟲ Neu</button>
    </div>
    <div class="row">
      <button id="btnViewMode" class="toggle">👁 Ansicht drehen</button>
      <button id="btnAutoSolve" class="primary">✨ Lösen</button>
    </div>
  </section>

  <!-- Funktion 2: Muster eingeben + Lösung -->
  <section id="screen-solve" class="screen">
    <div id="inputPane" class="pane">
      <div class="stage grow">
        <canvas id="preview3d"></canvas>
        <div class="palbar" id="palette" hidden></div>
        <div class="overlay" id="inToast"></div>
      </div>
      <div id="errBox" class="err" hidden></div>
      <div class="row">
        <button class="infoBtn" data-info="input" aria-label="Hinweise">i</button>
        <button id="btnClear">Leeren</button>
        <button id="btnFromCube">Vom 3D-Würfel</button>
      </div>
      <button id="btnCompute" class="primary wide">Lösung berechnen</button>
    </div>

    <div id="solvePane" hidden>
      <div class="phase"><div id="phaseTitle"></div><div id="phaseDesc"></div></div>
      <div class="stage big">
        <canvas id="solve3d"></canvas>
        <button class="info" data-info="solve" aria-label="Hinweise">i</button>
      </div>
      <canvas id="netMini" class="netMini"></canvas>
      <div class="move" id="moveBig">–</div>
      <div class="moveDesc" id="moveDesc"></div>
      <details id="algBox" class="algBox"><summary>Algorithmus anzeigen</summary>
        <div id="algName" class="algName"></div><div id="algMoves" class="algMoves"></div><div id="algText" class="algText"></div>
      </details>
      <div class="row ctrl">
        <button id="bStart">⏮</button>
        <button id="bBack">◀</button>
        <button id="bAuto" class="primary">▶ Auto</button>
        <button id="bNext">▶ Weiter</button>
      </div>
      <div class="status" id="stepInfo"></div>
      <div class="chips" id="chips"></div>
      <div class="row">
        <label class="check"><input type="checkbox" id="chkFollow"> Ansicht folgt dem Zug</label>
        <select id="selSpeed" aria-label="Geschwindigkeit"></select>
      </div>
      <div class="row"><button id="btnRecipe">📖 Rezept</button><button id="btnBackInput">✎ Neu eingeben</button></div>
    </div>
  </section>
  <!-- Lektionen -->
  <section id="screen-lessons" class="screen">
    <div id="lessonList"></div>
    <div id="lessonDetail" hidden>
      <div class="row"><button id="lBack">← Alle Lektionen</button></div>
      <h2 id="lTitle"></h2>
      <p id="lDesc" class="lDesc"></p>
      <div class="stage big"><canvas id="lesson3d"></canvas></div>
      <div class="algMoves big" id="lMoves"></div>
      <div class="row ctrl">
        <button id="lStart">⏮</button>
        <button id="lBackStep">◀</button>
        <button id="lAuto" class="primary">▶ Auto</button>
        <button id="lNext">▶ Weiter</button>
      </div>
      <div class="status" id="lInfo"></div>
      <div class="row"><span class="legendTxt">Farbig = beteiligte Steine, grau = bleiben egal. Rote Umrandung = Seite, die gedreht wird.</span>
        <select id="selSpeedLesson" aria-label="Geschwindigkeit"></select></div>
    </div>
  </section>
</main>
<nav>
  <button id="tab-cube" class="active">🧊 Würfel</button>
  <button id="tab-solve">🧩 Lösen</button>
  <button id="tab-lessons">🎓 Lektionen</button>
</nav>
<div id="modal" hidden><div class="card"><div id="modalText"></div><button id="modalClose" class="primary wide">OK</button></div></div>
<script src="cube.js"></script>
<script src="solver.js"></script>
<script src="lessons.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
